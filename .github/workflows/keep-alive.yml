name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 06:17 UTC (non-peak hour to avoid GitHub scheduler delays)
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Random Jitter Delay (0-10 minutes)
        run: |
          DELAY=$(( RANDOM % 600 ))
          echo "Sleeping for $DELAY seconds before pinging..."
          sleep $DELAY

      - name: Query Supabase Table (triggers real DB activity)
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "https://gxbpsbqpuaudtlfliezs.supabase.co/rest/v1/user_readings?select=id&limit=1" \
            -H "apikey: sb_publishable_HgFswhUnZWkHwtVyXTxt2g_h371PL5z" \
            -H "Authorization: Bearer sb_publishable_HgFswhUnZWkHwtVyXTxt2g_h371PL5z" \
            -H "Accept: application/json")
          
          echo "Supabase Response HTTP Code: $STATUS_CODE"
          
          if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 400 ]; then
            echo "Ping successful! Database query registered."
          else
            echo "Failed to query Supabase (status $STATUS_CODE)."
            exit 1
          fi
